<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turin energy climate screening</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;background:#f4f6f7;color:#16354A;font:15px/1.45 "Noto Sans",sans-serif}header{padding:16px 24px;border-bottom:1px solid #ccd7dd}h1{font-size:22px;margin:0 0 6px}header p{margin:4px 0;max-width:1050px}#map{height:calc(100vh - 170px);min-height:450px}.legend{background:white;padding:12px;border-radius:6px;box-shadow:0 1px 8px #0003;max-width:260px}.legend i{display:inline-block;width:16px;height:12px;margin-right:6px}.leaflet-popup-content{max-height:340px;overflow:auto}#status{color:#124E78;font-size:13px}
.leaflet-container,.leaflet-popup-content,.leaflet-control{font-family:"Noto Sans",sans-serif}
</style></head><body>
<header><h1>Turin · Energy infrastructure and climate exposure</h1>
<p id="scope">New open-data reconstruction. Coarse climate cells cannot resolve equipment microclimate. Public OSM mapping is incomplete; asset condition and network redundancy are unknown.</p>
<p id="status" role="status">Loading local results…</p></header><main id="map" aria-label="Interactive climate exposure and mapped infrastructure"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([45.07,7.69],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> (ODbL)'}).addTo(map);
map.attributionControl.addAttribution('<a href="https://open-meteo.com/">Open-Meteo</a> / Copernicus C3S–ECMWF (CC BY 4.0)');
const fmt=x=>x==null?'Unknown':typeof x==='number'?x.toFixed(2):String(x);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colour=v=>v==null?'#8a969d':v>=.75?'#124E78':v>=.5?'#137E89':v>=.25?'#439EB3':'#A8DCE5';
const legend=L.control({position:'bottomleft'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Equal-weight exposure priority</b><br>'+[[0,'0–0.25'],[.25,'0.25–0.50'],[.5,'0.50–0.75'],[.75,'0.75–1.00']].map(([v,t])=>'<i style="background:'+colour(v)+'"></i>'+t).join('<br>')+'<hr>Fixed reference ranges: heat 30 days/year; rain 100 mm; gust 10 days/year.<br>Clipped scores, not failure probabilities.';return d};legend.addTo(map);
Promise.all(['assets','study_area','climate_cells'].map(n=>fetch(n+'.geojson').then(r=>{if(!r.ok)throw Error(n+': '+r.status);return r.json()}))).then(([assets,study,cells])=>{
 const period=assets.features[0].properties.analysis_period||'2023, 2024';
 document.querySelector('#scope').textContent='New open-data reconstruction · Analysis years: '+period+'. Coarse climate cells cannot resolve equipment microclimate. Public OSM mapping is incomplete; asset condition and network redundancy are unknown.';
 const overlays={};
 const boundary=L.geoJSON(study,{style:{color:'#16354A',weight:2,fill:false}}).addTo(map);overlays['Study boundary · 1,400 km²']=boundary;map.fitBounds(boundary.getBounds());
 for(const type of ['line','minor_line','substation','transformer']){
  overlays[type]=L.geoJSON(assets,{filter:f=>f.properties.power===type,style:f=>({color:colour(f.properties.priority_equal),weight:type.includes('line')?2:1,fillOpacity:.6}),pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:'#fff',weight:1,fillColor:colour(f.properties.priority_equal),fillOpacity:1}),onEachFeature:(f,l)=>{
   const p=f.properties;
   l.bindPopup('<b>'+esc(p.name||p.asset_id)+'</b><br>'+esc(p.power)+' · '+esc(p.geometry_type)+'<br>Voltage: '+esc(p.voltage||'Unknown')+'<br>Operator: '+esc(p.operator||'Unknown')+'<hr>Heat: '+fmt(p.heat_mean)+' days/year (Tmax >35°C)<br>RX1day: '+fmt(p.rain_mean)+' mm (mean annual maximum daily rain)<br>Gust: '+fmt(p.wind_mean)+' days/year (>20 m/s)<br>Equal exposure priority: '+fmt(p.priority_equal)+'<br>Maximum-overlay priority: '+fmt(p.priority_maximum_overlay)+'<br>Stable top decile: '+esc(p.stable_top_decile)+'<hr>Line: length-weighted; polygon: area-weighted; point: cell assignment.<br>Condition / loading / redundancy: unknown.<br>Open-data reconstruction.');
  }}).addTo(map);
 }
 for(const [h,label,model,unit] of [['heat','Heat cells · 0.1°','era5_land','days/year >35°C'],['rain','Rain cells · 0.25°','era5','mm RX1day'],['wind','Gust cells · 0.25°','era5','days/year >20 m/s']]){
  overlays[label]=L.geoJSON(cells,{filter:f=>f.properties.model===model,style:{color:'#124E78',weight:1,fillColor:h==='heat'?'#137E89':'#439EB3',fillOpacity:.18},onEachFeature:(f,l)=>l.bindPopup(esc(f.properties.cell_id)+'<br>'+label+': '+fmt(f.properties[h])+' '+unit+'<br>Mean across '+esc(period)+'; native cell support. No added spatial information.')});
 }
 L.control.layers(null,overlays,{collapsed:false}).addTo(map);
 document.querySelector('#status').textContent=assets.features.length.toLocaleString()+' mapped assets · Open-data reconstruction · Toggle native climate cells at right.';
}).catch(e=>document.querySelector('#status').textContent='Unable to load results: '+e.message+'. Run the pipeline and serve this page through the local API.');
</script></body></html>
