[project]
name = "turin-energy-climate-reconstruction"
version = "0.1.0"
description = "Reproducible open-data infrastructure exposure screening"
requires-python = ">=3.12,<3.13"
dependencies = ["geopandas==1.2.0", "xarray==2026.9.0", "dask==2026.8.0", "rasterio==1.5.2", "scipy==1.18.1", "matplotlib==3.11.2", "requests==2.34.2", "fastapi==0.162.0", "uvicorn==0.54.0", "h5netcdf==1.8.2", "h5py==3.16.0", "pyyaml==6.0.3", "psutil==7.2.2", "cdsapi==0.7.7"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
